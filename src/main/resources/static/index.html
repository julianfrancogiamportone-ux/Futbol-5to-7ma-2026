<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelea de Futbol</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>🔥 ¡Pelea de Futbolistas! 🔥</h1>
    </header>

    <main>
        <div class="battle-arena">
            <div class="player-section">
                <div class="player-card">
                    <img id="fighter1Image" src="imagenes/unknown.jpeg" alt="Jugador 1" class="fighter-img">
                    <h2 id="fighter1Name">Seleccionar jugador</h2>
                    <p id="fighter1Club">-</p>
                </div>
                <select id="fighter1" class="player-select"></select>
            </div>

            <div class="vs-container">
                <span class="vs-text">VS</span>
            </div>

            <div class="player-section">
                <div class="player-card">
                    <img id="fighter2Image" src="imagenes/unknown.jpeg" alt="Jugador 2" class="fighter-img">
                    <h2 id="fighter2Name">Seleccionar jugador</h2>
                    <p id="fighter2Club">-</p>
                </div>
                <select id="fighter2" class="player-select"></select>
            </div>
        </div>

        <button id="fightButton" class="fight-btn">¡PELEAR!</button>

        <div id="result" class="result hidden"></div>
    </main>

    <script src="battle2.js"></script>
</body>

</html>
